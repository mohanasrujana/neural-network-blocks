<text x="350.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">nested_while - nested_while_mlp_trained</text>
<text x="350.0" y="58" text-anchor="middle" font-size="13" fill="#666">
        outer = 0
        inner = 0
        w = 0
        v = x
        while v &gt; 4:
            inner = 0
            w = v
            while w &gt; 0:
                w = w - 2
                inner = inner + 1
            outer = outer + inner
            v = v - 3
        return outer &gt;= 2
          |  trained_mlp  |  accuracy 1.00</text>
