<text x="350.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">while_then_for - while_then_for_mlp_trained</text>
<text x="350.0" y="58" text-anchor="middle" font-size="13" fill="#666">
        v = x
        while v &gt; 3:
            v = v - 2
        found = 0
        for i in range(3):
            found = found OR (v == i)
        return found
          |  trained_mlp  |  accuracy 1.00</text>
