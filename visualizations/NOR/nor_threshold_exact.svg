<svg xmlns="http://www.w3.org/2000/svg" width="480" height="312" viewBox="0 0 480 312" font-family="Helvetica, Arial, sans-serif">

<style type="text/css"><![CDATA[
  .edge { cursor: pointer; }
  .edge-line { transition: stroke-width .15s, stroke-opacity .15s; }
  .edge:hover .edge-line { stroke-opacity: 1; stroke-width: 5; }
  .edge .wlabel { transition: opacity .15s; }
  .edge:hover .wlabel rect { stroke-width: 2; }
  .neuron { cursor: pointer; transition: stroke-width .15s; }
  .neuron:hover { stroke-width: 3; }
  .neuron.dim { opacity: .35; }
  .edge.dim .edge-line { opacity: .2; }
  .edge.dim .wlabel { opacity: .25; }
  svg.hide-weights .wlabel { display: none; }
  svg.hide-biases .bias-label { display: none; }
]]></style>
<rect width="480" height="312" fill="#fafafa"/>
<text x="240.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">NOR - nor_threshold_exact</text>
<text x="240.0" y="58" text-anchor="middle" font-size="13" fill="#666">exact_threshold  |  accuracy 1.00</text>
<g id="diagram">
<g class="edge" data-layer="0" data-edge="0" data-weight="-1.0000" data-from="x1" data-to="y" data-sign="neg">
<title>x1 → y: -1.00</title>
<line class="edge-line" x1="130.0" y1="116.0" x2="350.0" y2="161.0" stroke="#d7301f" stroke-width="5.50" stroke-opacity="0.72"/>
</g>
<g class="edge" data-layer="0" data-edge="1" data-weight="-1.0000" data-from="x2" data-to="y" data-sign="neg">
<title>x2 → y: -1.00</title>
<line class="edge-line" x1="130.0" y1="206.0" x2="350.0" y2="161.0" stroke="#d7301f" stroke-width="5.50" stroke-opacity="0.72"/>
</g>
<g class="neuron" data-neuron="x1"><circle cx="130.0" cy="116.0" r="26" fill="#e8f4ea" stroke="#333333" stroke-width="1.6"/>
<text x="130.0" y="120.0" text-anchor="middle" font-size="13" font-weight="600" fill="#222">x1</text>
</g>
<g class="neuron" data-neuron="x2"><circle cx="130.0" cy="206.0" r="26" fill="#e8f4ea" stroke="#333333" stroke-width="1.6"/>
<text x="130.0" y="210.0" text-anchor="middle" font-size="13" font-weight="600" fill="#222">x2</text>
</g>
<text x="130.0" y="82.0" text-anchor="middle" font-size="12" fill="#888">input</text>
<g class="neuron" data-neuron="y"><circle cx="350.0" cy="161.0" r="26" fill="#fdece8" stroke="#333333" stroke-width="1.6"/>
<text x="350.0" y="165.0" text-anchor="middle" font-size="13" font-weight="600" fill="#222">y</text>
<text class="bias-label" x="350.0" y="201.0" text-anchor="middle" font-size="10" fill="#555">bias +0.50</text>
</g>
<text x="350.0" y="82.0" text-anchor="middle" font-size="12" fill="#888">output (step)</text>
<g class="label-layer">
<g class="wlabel" data-edge="0" pointer-events="none"><rect x="166.1" y="129.4" width="47.0" height="18" rx="5" fill="#ffffff" fill-opacity="0.95" stroke="#d7301f" stroke-width="1.2"/><text x="189.6" y="142.4" text-anchor="middle" font-size="11" font-weight="700" fill="#d7301f">-1.00</text></g>
<g class="wlabel" data-edge="1" pointer-events="none"><rect x="262.3" y="151.9" width="47.0" height="18" rx="5" fill="#ffffff" fill-opacity="0.95" stroke="#d7301f" stroke-width="1.2"/><text x="285.8" y="164.9" text-anchor="middle" font-size="11" font-weight="700" fill="#d7301f">-1.00</text></g>
</g>
<line x1="130" y1="260" x2="164" y2="260" stroke="#2c7fb8" stroke-width="4"/>
<text x="172" y="264" font-size="12" fill="#555">positive (+)</text>
<line x1="280" y1="260" x2="314" y2="260" stroke="#d7301f" stroke-width="4"/>
<text x="322" y="264" font-size="12" fill="#555">negative (−)</text>
<text x="450" y="264" font-size="12" fill="#555">hover edge for details</text>
</g></svg>