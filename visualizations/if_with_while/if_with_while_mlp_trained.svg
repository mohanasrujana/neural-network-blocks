<text x="350.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">if_with_while - if_with_while_mlp_trained</text>
<text x="350.0" y="58" text-anchor="middle" font-size="13" fill="#666">
        if x &gt; 5:
            v = x - 3
        else:
            v = x + 2
        steps = 0
        while v &gt; 0:
            v = v - 1
            steps = steps + 1
        return steps &gt;= 4
          |  trained_mlp  |  accuracy 1.00</text>
