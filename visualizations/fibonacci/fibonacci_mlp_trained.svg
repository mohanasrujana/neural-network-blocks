<text x="350.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">fibonacci - fibonacci_mlp_trained</text>
<text x="350.0" y="58" text-anchor="middle" font-size="13" fill="#666">
        a = 0
        b = 1
        tmp = 0
        n = x
        while n &gt; 0:
            tmp = a + b
            a = b
            b = tmp
            n = n - 1
        return a
          |  trained_mlp  |  accuracy 1.00</text>
